[project]
name = "coldchain-streaming"
version = "0.1.0"
description = "Pipeline Kafka + Beam para cadena de frio ultrabaja (proyecto integrador)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "apache-beam==2.74.0",
  "confluent-kafka>=2.8,<3",
  "pandas>=2.2,<3",
  "pyarrow>=18,<21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coldchain_streaming"]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: requires the Docker Compose stack"]
filterwarnings = [
  # Beam's TestPipeline/TestStream match pytest's "Test*" collection heuristic but are not
  # test classes (they have an __init__ constructor); harmless, just noisy.
  "ignore::pytest.PytestCollectionWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/coldchain_streaming/transforms.py" = ["B008"]
